name: Builder price list
# Rebuilds builder/prices.json whenever the builder changes, so
# snapinboatcarpets.com can check "Order now" prices against it.
on:
  push:
    branches: [main]
    paths: ['builder/index.html', 'builder/gen-prices.js']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: builder-prices
  cancel-in-progress: true
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node builder/gen-prices.js
      - name: Commit price list if it changed
        run: |
          git config user.name "builder-prices-bot"
          git config user.email "builder-prices-bot@users.noreply.github.com"
          git add builder/prices.json
          git diff --cached --quiet || (git commit -m "Update builder price list" && git push)
